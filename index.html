<!DOCTYPE html>
<html lang="en">
  <head>

  <body>
    <div id="container">
  <p1 id="lang">============================</p1>

  <p1 id="lang">============================</p1>

<input type="text" id="name" placeholder="Enter Your Name">

<div id="step2">
<p1 id="lang">ready for countdown start✨</p1>

</div>
